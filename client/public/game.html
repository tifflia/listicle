<!doctype html>
<html lang="en">
  <head>
    <title>Party Games</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="../style.css">
    <script defer src="../scripts/header.js"></script>
    <script defer src="../scripts/games.js"></script>
  </head>
  <body>
    <header></header>
    <main id="game-content" class="game-info">
        <div class="image-container">
          <img id="image" src="" alt="Game Image">
        </div>
        <div class="game-details">
          <h2 id="name"></h2>
          <p id="players"></p>
          <p id="playingTime"></p>
          <p id="age"></p>
          <p id="complexity"></p>
          <p id="mechanics"></p>
          <p id="description"></p>
        </div>
    </main>
  </body>
</html>
